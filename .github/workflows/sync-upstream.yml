name: Sync upstream BareBrowser

on:
  schedule:
    # Every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and merge upstream
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/BareBrowser/bare-browser.git
          git fetch upstream main
          BEFORE=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            AFTER=$(git rev-parse HEAD)
            if [[ "$BEFORE" == "$AFTER" ]]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Already up to date with upstream/main"
            else
              git push origin HEAD:main
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Merged upstream/main and pushed"
            fi
          else
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Merge conflict with upstream. Resolve fork/ overlays manually."
            exit 1
          fi

      - name: Trigger patched APK build
        if: steps.sync.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-patched-apk.yml',
              ref: 'main',
              inputs: { source: 'latest' }
            });
