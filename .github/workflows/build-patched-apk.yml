name: Build patched Bare APK

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Upstream release tag (e.g. v2.0.3) or 'latest'"
        required: true
        default: "latest"
  repository_dispatch:
    types: [bare-release]
  schedule:
    - cron: "42 6 * * *"

permissions:
  contents: write

concurrency:
  group: build-patched-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve upstream release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="${{ github.event.inputs.source || 'latest' }}"
          if [[ "$SRC" == "latest" || -z "$SRC" ]]; then
            TAG=$(gh release view -R BareBrowser/bare-browser --json tagName -q .tagName)
          else
            TAG="$SRC"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ASSET=$(gh release view -R BareBrowser/bare-browser "$TAG" --json assets \
            -q '.assets[].name | select(test("arm64-v8a\\.apk$"))' | head -n1)
          if [[ -z "$ASSET" ]]; then
            echo "No arm64 APK on release $TAG" >&2
            exit 1
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "Using $TAG / $ASSET"

      - name: Skip if we already published this upstream tag
        id: skip
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          OURS="patched-${TAG}"
          if gh release view "$OURS" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already have $OURS"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download upstream APK
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download "${{ steps.rel.outputs.tag }}" -R BareBrowser/bare-browser \
            -p "${{ steps.rel.outputs.asset }}" -D work
          ls -lh work

      - name: Fetch tools
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          bash fork/tools/fetch_smali_tools.sh "$GITHUB_WORKSPACE/.fork-tools"
          curl -fsSL -o "$GITHUB_WORKSPACE/.fork-tools/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar"
          curl -fsSL -o "$GITHUB_WORKSPACE/.fork-tools/uber-apk-signer.jar" \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"

      - name: Patch snackbars + settings UI
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          BAKSMALI_CP=$(cat "$GITHUB_WORKSPACE/.fork-tools/baksmali.cp")
          SMALI_CP=$(cat "$GITHUB_WORKSPACE/.fork-tools/smali.cp")
          python3 fork/tools/patch_bare_snackbars.py \
            --apk "work/${{ steps.rel.outputs.asset }}" \
            --work work/patch \
            --out work/patched-unsigned.apk \
            --baksmali-cp "$BAKSMALI_CP" \
            --smali-cp "$SMALI_CP" \
            --apktool-jar "$GITHUB_WORKSPACE/.fork-tools/apktool.jar" \
            --overlay-smali fork/overlay/smali

      - name: Decode signing keystore
        if: steps.skip.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" ]]; then
            echo "Missing FORK_KEYSTORE_BASE64 / FORK_KEYSTORE_PASSWORD / FORK_KEY_ALIAS secrets" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > work/fork.keystore

      - name: Sign APK
        if: steps.skip.outputs.skip != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          java -jar "$GITHUB_WORKSPACE/.fork-tools/uber-apk-signer.jar" \
            --apks work/patched-unsigned.apk \
            --out work/signed \
            --ks work/fork.keystore \
            --ksAlias "$KEY_ALIAS" \
            --ksPass "$KEYSTORE_PASSWORD" \
            --ksKeyPass "$KEYSTORE_PASSWORD"
          SIGNED=$(find work/signed -type f -name '*.apk' ! -name '*-unsigned*' | head -n1)
          if [[ -z "$SIGNED" ]]; then
            echo "signed apk not found" >&2
            ls -laR work/signed >&2 || true
            exit 1
          fi
          OUT="work/Bare-${TAG#v}-arm64-v8a-snackbar-patched.apk"
          cp "$SIGNED" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_ENV"
          sha256sum "$OUT" | tee work/SHA256SUMS.txt
          ls -lh "$OUT"

      - name: Publish GitHub release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          REL="patched-${TAG}"
          TITLE="Patched Bare ${TAG} (snackbar toggles)"
          BODY=$(cat <<EOF
          Custom build of Bare \`${TAG}\` with optional snackbar toggles.

          - Package: \`org.barebrowser\`
          - Defaults match official Bare (notices still show)
          - Open the **Bare snackbar settings** launcher icon to hide fullscreen exit and/or tab-close Undo
          - Signed with this fork's CI keystore (not Bare's official key)
          - **Uninstall official Bare once** before installing; later patched releases update in place

          Source: BareBrowser/bare-browser \`${TAG}\` / \`${{ steps.rel.outputs.asset }}\`
          EOF
          )
          if gh release view "$REL" >/dev/null 2>&1; then
            gh release upload "$REL" "$apk" work/SHA256SUMS.txt --clobber
          else
            gh release create "$REL" "$apk" work/SHA256SUMS.txt --title "$TITLE" --notes "$BODY"
          fi
